name = "fortnum-differentiation-report"
version = "0.1.0"
license = "MIT"

[build]
auto-executables = false
auto-tests = false
auto-examples = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
fortplot = { git = "https://github.com/lazy-fortran/fortplot.git", rev = "35a9cd26ab20cf50ba6f7347d7daf13566e0dc91" }

[[executable]]
name = "plot_differentiation_report"
source-dir = "app"
main = "plot_differentiation_report.f90"

[[executable]]
name = "plot_gpu_report"
source-dir = "app"
main = "plot_gpu_report.f90"
