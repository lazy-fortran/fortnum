name = "fortnum-differentiation-report"
version = "0.1.0"
license = "MIT"

[build]
auto-executables = false
auto-tests = false
auto-examples = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
fortplot = { git = "https://github.com/lazy-fortran/fortplot.git", rev = "6df2696b645bbc57f42a5e04ceb54a3755070e7b" }

[[executable]]
name = "plot_differentiation_report"
source-dir = "app"
main = "plot_differentiation_report.f90"
