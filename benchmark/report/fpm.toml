name = "fortnum-differentiation-report"
version = "0.1.0"
license = "MIT"

[build]
auto-executables = false
auto-tests = false
auto-examples = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
fortplot = { git = "https://github.com/lazy-fortran/fortplot.git", rev = "1645fa41c11b5786c71bc27e5b41dae7c7bbba23" }

[[executable]]
name = "plot_differentiation_report"
source-dir = "app"
main = "plot_differentiation_report.f90"

[[executable]]
name = "plot_gpu_report"
source-dir = "app"
main = "plot_gpu_report.f90"
