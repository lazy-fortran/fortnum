name = "fortnum_codegen"
version = "0.1.0"
license = "MIT"

[dependencies]
fortsym = { path = "../../../lazy-fortran/fortsym" }

[build]
auto-executables = true

[fortran]
implicit-typing = false
source-form = "free"

[[executable]]
name = "gen_dawson_outer"
source-dir = "app"
main = "gen_dawson_outer.f90"

[[executable]]
name = "gen_determinant_products"
source-dir = "app"
main = "gen_determinant_products.f90"

[[executable]]
name = "gen_inverse_products"
source-dir = "app"
main = "gen_inverse_products.f90"

[[executable]]
name = "gen_multi_input_scalar"
source-dir = "app"
main = "gen_multi_input_scalar.f90"

[[executable]]
name = "gen_implicit_root_residual"
source-dir = "app"
main = "gen_implicit_root_residual.f90"

[[executable]]
name = "gen_lagrange4_interpolation"
source-dir = "app"
main = "gen_lagrange4_interpolation.f90"

[[executable]]
name = "gen_dawson_jvp_variants"
source-dir = "app"
main = "gen_dawson_jvp_variants.f90"
