name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated:
    name: generated sources are current
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            gfortran \
            libblas-dev \
            libflint-dev \
            libgmp-dev \
            liblapack-dev \
            libmpfr-dev \
            libsymengine-dev \
            ninja-build

      - name: Install fpm and fo
        run: |
          set -euo pipefail
          sudo curl -L -o /usr/local/bin/fpm \
            https://github.com/fortran-lang/fpm/releases/download/v0.13.0/fpm-0.13.0-linux-x86_64-gcc-12
          sudo chmod +x /usr/local/bin/fpm
          git clone --depth 1 https://github.com/lazy-fortran/fo.git /tmp/fo
          (
            cd /tmp/fo
            fpm install --profile release --prefix "$HOME/.local"
          )
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Checkout locked fortsym revision
        run: |
          set -euo pipefail
          mkdir -p ../lazy-fortran
          git clone https://github.com/lazy-fortran/fortsym.git \
            ../lazy-fortran/fortsym
          git -C ../lazy-fortran/fortsym checkout \
            "$(cat tools/codegen/fortsym.lock)"

      - name: Register and run CTest drift check
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          cmake -S . -B build-generated -G Ninja \
            -DFORTNUM_BUILD_TESTING=OFF \
            -DFORTNUM_BUILD_EXAMPLES=OFF \
            -DFORTNUM_CHECK_GENERATED=ON
          ctest --test-dir build-generated --output-on-failure \
            -R generated_sources_current

  # Primal (non-derivative) build and test with gfortran. Required.
  gfortran:
    name: gfortran ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            gfortran \
            ninja-build \
            liblapack-dev \
            libblas-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DFORTNUM_BUILD_TESTING=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Reference "oracle" table generation against an independent implementation
  # (NumPy/SciPy). Non-required: stays green until the generator from #4 lands,
  # then runs it once to refresh the checked-in reference tables.
  oracle:
    name: oracle reference tables
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy scipy

      - name: Generate oracle tables
        run: |
          set -euo pipefail
          # The generator is introduced by #4. Until then, skip cleanly so this
          # job is informational only. Search the conventional locations.
          gen=""
          for cand in \
            tools/oracle/generate.py \
            tools/generate_oracle.py \
            test/oracle/generate.py \
            scripts/generate_oracle.py; do
            if [ -f "$cand" ]; then
              gen="$cand"
              break
            fi
          done
          if [ -z "$gen" ]; then
            echo "No oracle generator found yet (issue #4); skipping."
            exit 0
          fi
          echo "Running oracle generator: $gen"
          python "$gen"

  # Benchmark regression gate. Builds the standalone benchmark, runs it in
  # JSON mode, and compares against benchmark/baseline.json. A primal
  # regression beyond the factor fails the job. Derivative-overhead checks
  # are informational (non-blocking) until runner timing noise is
  # characterized; see benchmark/README.md and gate.py --gate-derivative.
  # GitHub-hosted runners are noisy, so the factor is generous (4x): the gate
  # catches order-of-magnitude regressions, not micro-noise.
  benchmark:
    name: benchmark regression gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            gfortran \
            ninja-build \
            liblapack-dev \
            libblas-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure benchmark
        run: |
          cmake -S benchmark -B build-bench -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build benchmark
        run: cmake --build build-bench -j

      - name: Run benchmark
        run: ./build-bench/bin/bench_main --json | tee bench-run.json

      - name: Gate against baseline
        run: |
          python3 benchmark/gate.py \
            --baseline benchmark/baseline.json \
            --run bench-run.json \
            --factor 4.0

      - name: Re-select Dawson candidates on hosted hardware
        run: |
          set -euo pipefail
          lscpu > new-target-host.txt
          python3 benchmark/collect_dawson_family.py \
            --executable build-bench/bin/bench_dawson_generated_family \
            --output new-target-dawson-family.json

      - name: Upload hosted-hardware selection
        uses: actions/upload-artifact@v4
        with:
          name: hosted-dawson-selection-${{ github.sha }}
          path: |
            new-target-dawson-family.json
            new-target-host.txt
          retention-days: 30

  enzyme:
    name: released Flang 22 + pinned Enzyme
    runs-on: ubuntu-24.04
    env:
      LLVM_MAJOR: "22"
      ENZYME_REVISION: c96508349d9f121957292308c646b4a1fd53c507
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates cmake curl g++ gfortran git gnupg \
            libblas-dev libfftw3-dev liblapack-dev lsb-release ninja-build \
            software-properties-common

      - name: Install fpm and fo
        run: |
          set -euo pipefail
          sudo curl -L -o /usr/local/bin/fpm \
            https://github.com/fortran-lang/fpm/releases/download/v0.13.0/fpm-0.13.0-linux-x86_64-gcc-12
          sudo chmod +x /usr/local/bin/fpm
          git clone --depth 1 https://github.com/lazy-fortran/fo.git /tmp/fo
          (
            cd /tmp/fo
            fpm install --profile release --prefix "$HOME/.local"
          )
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install released LLVM and Flang
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_MAJOR"
          sudo apt-get install -y --no-install-recommends \
            "flang-$LLVM_MAJOR" \
            "libclang-$LLVM_MAJOR-dev" \
            "llvm-$LLVM_MAJOR-dev"
          mkdir -p "$RUNNER_TEMP/llvm-bin"
          for tool in clang flang-new llvm-link opt; do
            ln -s "/usr/bin/$tool-$LLVM_MAJOR" "$RUNNER_TEMP/llvm-bin/$tool"
          done
          echo "$RUNNER_TEMP/llvm-bin" >> "$GITHUB_PATH"

      - name: Build pinned Enzyme plugin
        run: |
          set -euo pipefail
          git clone https://github.com/EnzymeAD/Enzyme.git "$RUNNER_TEMP/enzyme"
          git -C "$RUNNER_TEMP/enzyme" checkout "$ENZYME_REVISION"
          cmake -S "$RUNNER_TEMP/enzyme/enzyme" \
            -B "$RUNNER_TEMP/enzyme-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="/usr/lib/llvm-$LLVM_MAJOR/lib/cmake/llvm"
          cmake --build "$RUNNER_TEMP/enzyme-build" \
            --target "LLVMEnzyme-$LLVM_MAJOR" -j 2
          echo "FORTNUM_CI_ENZYME_PLUGIN=$RUNNER_TEMP/enzyme-build/Enzyme/LLVMEnzyme-$LLVM_MAJOR.so" \
            >> "$GITHUB_ENV"

      - name: Generate Enzyme wrappers with locked fortsym
        run: |
          set -euo pipefail
          mkdir -p ../lazy-fortran "$RUNNER_TEMP/enzyme-wrappers"
          git clone https://github.com/lazy-fortran/fortsym.git \
            ../lazy-fortran/fortsym
          git -C ../lazy-fortran/fortsym checkout \
            "$(cat tools/codegen/fortsym.lock)"
          (
            cd tools/codegen
            FORTNUM_ENZYME_WRAPPER_OUTPUT_DIR="$RUNNER_TEMP/enzyme-wrappers" \
              fo exec gen_enzyme_scalar_wrappers
          )

      - name: Configure required hybrid pipeline
        run: |
          set -euo pipefail
          cmake -S . -B build-enzyme -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFORTNUM_BUILD_TESTING=ON \
            -DFORTNUM_BUILD_EXAMPLES=OFF \
            -DFORTNUM_ENABLE_ENZYME=ON \
            -DFORTNUM_ENZYME_REQUIRED=ON \
            -DFORTNUM_ENZYME_PLUGIN="$FORTNUM_CI_ENZYME_PLUGIN" \
            -DFORTNUM_ENZYME_WRAPPER_DIR="$RUNNER_TEMP/enzyme-wrappers"

      - name: Build
        run: cmake --build build-enzyme -j 2

      - name: Test real Enzyme pipelines
        run: ctest --test-dir build-enzyme --output-on-failure -R enzyme
