name = "fortnum"
version = "0.1.0"
description = "Primal-first, derivative-ready clean-room Fortran numerical library"
author = "Christopher Albert"
maintainer = "albert@tugraz.at"
license = "MIT"
copyright = "Copyright 2025, lazy-fortran"

[dev-dependencies]
test-drive = { git = "https://github.com/fortran-lang/test-drive.git" }

[build]
auto-tests = true
# roots/fortnum_roots_complex.f90 calls LAPACK ZGGEV; link LAPACK and its BLAS
# so the fpm/fo build resolves it without relying on the default library path.
# Reference netlib LAPACK and BLAS.
#
# This is measurably slow: a 400 by 4000 triangular solve takes 143 ms here
# against 52 ms for the same operation through numpy's threaded OpenBLAS, and
# that solve dominates every Gaussian-process prediction in the stack.
#
# Switching to OpenBLAS was tried and reverted. It breaks
# test_complex_linear_solve_products, whose complex solve JVP stops matching
# central differences within its 2e-10 tolerance -- the complex BLAS kernels
# round differently. Loosening a correctness tolerance to unlock a performance
# change is not a trade this package makes, so the default stays on the
# implementation the tests were validated against and the cost is recorded
# rather than hidden. Callers who want the faster BLAS can link it themselves.
link = ["lapack", "blas"]

[fortran]
implicit-typing = false
source-form = "free"

[extra.fo.test-args]
test_oracle_selftest = ["test/oracle/data/gamma.csv"]
test_fortnum_special_bessel_oracle = ["test/oracle/data/bessel.csv"]
test_fortnum_special_dawson_oracle = ["test/oracle/data/dawson.csv"]
test_fortnum_special_complex_bessel_oracle = ["test/oracle/data/complex_bessel.csv"]
test_fortnum_complex_bessel_halfplane = ["test/oracle/data/complex_bessel_halfplane.csv"]
test_fortnum_special_erf_cbind_oracle = [
    "test/oracle/data/erf.csv",
    "test/oracle/data/erfc.csv",
]
test_fortnum_special_hyperg_oracle = ["test/oracle/data/hyperg_1f1.csv"]
test_fortnum_special_gamma_oracle = ["test/oracle/data/lower_incomplete_gamma.csv"]
test_fortnum_integrate_gk_oracle = ["test/oracle/data/integrate_gk.csv"]
test_fortnum_quadrature_oracle = ["test/oracle/data/gauss_legendre.csv"]
test_fortnum_gen_laguerre_oracle = ["test/oracle/data/gauss_gen_laguerre.csv"]
test_fortnum_fft_oracle = ["test/oracle/data/fft_c2c.csv"]
test_fortnum_ode_oracle = ["test/oracle/data"]
test_fortnum_dop853_oracle = ["test/oracle/data"]
test_fortnum_roots_oracle = ["test/oracle/data/roots.csv"]
test_fortnum_roots_brent_oracle = ["test/oracle/data/roots_brent.csv"]
test_fortnum_multiroot_oracle = [
    "test/oracle/data/multiroot.csv",
    "test/oracle/data/deriv_central.csv",
    "test/oracle/data/argsort.csv",
]
test_fortnum_complex_roots_oracle = ["test/oracle/data/complex_roots.csv"]
test_fortnum_bspline_oracle = ["test/oracle/data/bspline.csv"]
test_fortnum_cquad_oracle = ["test/oracle/data/cquad.csv"]
test_fortnum_integrate_oracle = [
    "test/oracle/data/integrate_qag_smooth.csv",
    "test/oracle/data/integrate_qags_singular.csv",
]
test_fortnum_integrate_singular_oracle = [
    "test/oracle/data/integrate_qagp_singular.csv",
    "test/oracle/data/integrate_qagiu_infinite.csv",
]
test_fortnum_levin_oracle = ["test/oracle/data/levin_u.csv"]
